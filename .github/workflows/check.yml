name: check
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: border-city/package-lock.json
      - run: npm ci
        working-directory: border-city
      - run: npm run check
        working-directory: border-city
